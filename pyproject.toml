[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-auth"
version = "0.3.0"
description = "Windows 校园网自动认证工具（锐捷工作流 / 华三 CAS SSO / 通用登录）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "campus-auth contributors" }]
keywords = ["campus-network", "ruijie", "h3c", "authentication", "captive-portal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License",
]
# 锐捷/通用模式纯标准库；华三 CAS 模式需要 pycryptodome（打包版已内置）
dependencies = []

[project.optional-dependencies]
# 华三 CAS SSO 模式（AES 密码加密）
cas = ["pycryptodome>=3.20"]
dev = ["ruff>=0.6"]

[project.scripts]
campus-auth = "campus_auth.cli:main"

[project.urls]
Homepage = "https://github.com/JianHeShui/campus-auth"
Releases = "https://github.com/JianHeShui/campus-auth/releases"
Issues = "https://github.com/JianHeShui/campus-auth/issues"

[tool.setuptools]
packages = ["campus_auth"]

# 托盘图标随包安装（源码运行时优先用项目根的 tray.ico，pip 安装后回退到包内副本）
[tool.setuptools.package-data]
campus_auth = ["tray.ico"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["campus_auth"]
